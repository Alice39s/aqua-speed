name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun run src/cli.ts --help
      - name: Build and verify container
        if: runner.os == 'Linux'
        run: |
          docker build . --tag aqua-speed:ci
          docker run --rm --entrypoint /bin/sh aqua-speed:ci -c 'getcap /bin/ping | grep -F cap_net_raw=ep'
