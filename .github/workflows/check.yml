name: Check
on:
  pull_request:
  push:
    branches: [main, "chore/**", "feat/**"]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run src/cli.ts --help
      - name: Build and verify container
        if: runner.os == 'Linux'
        run: |
          docker build . --tag aqua-speed:ci
          docker run --rm --entrypoint /bin/sh aqua-speed:ci -c 'getcap /bin/ping | grep -F cap_net_raw=ep'
